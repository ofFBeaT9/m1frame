size(); addEventListener("resize",size);
N.forEach(n=>{n.x=W/2+(Math.random()-.5)*240;n.y=H/2+(Math.random()-.5)*240;n.vx=0;n.vy=0;});
let drag=null,hover=null,mx=0,my=0;
function step(){
  for(let i=0;i<N.length;i++){const a=N[i];
    for(let j=i+1;j<N.length;j++){const b=N[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2);
      const f=2600/d2; const fx=dx/d*f,fy=dy/d*f; a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
    a.vx+=(W/2-a.x)*0.0016; a.vy+=(H/2-a.y)*0.0016; }
  L.forEach(l=>{const a=N[idx[l.source]],b=N[idx[l.target]];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-120)*0.02,fx=dx/d*f,fy=dy/d*f; a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;});

}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#30363d"; ctx.lineWidth=1;
  L.forEach(l=>{const a=N[idx[l.source]],b=N[idx[l.target]];

    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});
  ctx.globalAlpha=1;
  N.forEach(n=>{const deg=L.filter(l=>l.source===n.id||l.target===n.id).length;

}
