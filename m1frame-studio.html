<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m1frame Studio — deliberation, live</title>
<meta name="description" content="m1frame Studio — watch a council of AI agents deliberate, ground, and remember in real time.">
<style>
/* ════════════════════════════════════════════════════════════════════════
   m1frame Studio — "deep observatory" aesthetic.
   Offline-first: no CDN. Distinctive type via Bahnschrift (Win DIN grotesque)
   + Cascadia Code mono, with graceful fallbacks. A breathing aurora takes on
   the active pillar's hue; the knowledge graph grows as a live constellation.
   ════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#07090f; --bg2:#0a0d16; --panel:#0e1220; --panel2:#121728; --raise:#161c30;
  --line:#1d2438; --line2:#283149; --ink:#e7ecf6; --ink2:#b4bedb; --mute:#8d9ab8; --faint:#7c89a5;
  --signal:#34e7e4; --signal-dim:#1b8f8d;
  --bmad:#f5a623; --council:#a78bfa; --openplanter:#fb923c; --miras:#22d3ee;
  --karpathy:#fb7185; --wiki:#34d399; --system:#34e7e4;
  --pass:#34d399; --concern:#f5a623; --fail:#fb7185;
  --aurora:var(--signal);
  --shadow:0 18px 50px -18px rgba(0,0,0,.8);
  --disp:"Bahnschrift","DIN Alternate","Oswald","Segoe UI",ui-sans-serif,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono","SFMono-Regular",ui-monospace,Consolas,monospace;
  --body:"Segoe UI Variable Text","Segoe UI",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:14px; line-height:1.55; overflow:hidden; letter-spacing:.1px;
  -webkit-font-smoothing:antialiased;
}
/* ── atmosphere layers ───────────────────────────────────────────────── */
#stars{position:fixed; inset:0; z-index:0; opacity:.55}
.aurora{position:fixed; z-index:0; pointer-events:none; filter:blur(70px); opacity:.5;
  transition:background 1.2s ease, opacity 1.2s ease; mix-blend-mode:screen}
#aur1{top:-22vh; left:-6vw; width:62vw; height:62vh;
  background:radial-gradient(circle at 50% 50%, var(--aurora) 0%, transparent 62%)}
#aur2{bottom:-26vh; right:-10vw; width:58vw; height:58vh;
  background:radial-gradient(circle at 50% 50%, var(--council) 0%, transparent 64%); opacity:.32}
body::after{ /* grain + scanlines */
  content:""; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.05;
  background-image:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay}
#app{position:relative; z-index:2; height:100vh; overflow:hidden; display:grid;
  grid-template-columns:66px 1fr; }

/* ── nav rail ─────────────────────────────────────────────────────────── */
nav{border-right:1px solid var(--line); background:linear-gradient(180deg,#0a0d17,#080a12);
  display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:6px; position:relative}
nav::before{content:""; position:absolute; top:64px; bottom:64px; left:50%; width:1px;
  background:linear-gradient(180deg,transparent,var(--line2),transparent)}
.brand{width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  background:radial-gradient(circle at 30% 25%, #16324a, #0c1830);
  border:1px solid #1e3a52; box-shadow:0 0 22px -6px var(--signal); margin-bottom:14px; cursor:pointer}
.brand b{font-family:var(--disp); font-weight:700; font-size:17px; color:var(--signal);
  letter-spacing:.5px; text-shadow:0 0 12px var(--signal-dim)}
.navbtn{width:42px; height:42px; border-radius:11px; display:grid; place-items:center;
  color:var(--mute); cursor:pointer; position:relative; z-index:1; background:transparent;
  border:1px solid transparent; transition:.18s}
.navbtn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.6}
.navbtn:hover{color:var(--ink2); background:var(--panel); border-color:var(--line)}
.navbtn.on{color:var(--signal); background:#0c1a24; border-color:#16384a;
  box-shadow:inset 0 0 16px -8px var(--signal)}
.navbtn.on::before{content:""; position:absolute; left:-14px; top:9px; bottom:9px; width:3px;
  border-radius:3px; background:var(--signal); box-shadow:0 0 12px var(--signal)}
.navbtn .tip{position:absolute; left:52px; white-space:nowrap; background:var(--raise);
  border:1px solid var(--line2); color:var(--ink); padding:4px 9px; border-radius:7px;
  font-size:12px; opacity:0; transform:translateX(-6px); pointer-events:none; transition:.15s; z-index:30}
.navbtn:hover .tip{opacity:1; transform:none}
.navspacer{flex:1}

/* ── shell ────────────────────────────────────────────────────────────── */
main{display:flex; flex-direction:column; min-width:0; min-height:0; height:100%}
header{display:flex; align-items:center; gap:18px; padding:13px 22px;
  border-bottom:1px solid var(--line); background:linear-gradient(180deg,rgba(14,18,32,.7),rgba(8,10,18,.4));
  backdrop-filter:blur(8px)}
.word{font-family:var(--disp); font-weight:700; font-size:20px; letter-spacing:.4px}
.word span{color:var(--signal)}
.word .st{margin-left:9px; font-size:11px; letter-spacing:4px; color:var(--mute); font-weight:600;
  border:1px solid var(--line2); padding:2px 7px; border-radius:5px; vertical-align:2px}
.tag{color:var(--mute); font-size:12.5px; border-left:1px solid var(--line2); padding-left:16px}
.spacer{flex:1}
.chip{display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:8px;
  background:var(--panel); border:1px solid var(--line); font-size:12.5px; color:var(--ink2);
  font-family:var(--mono); cursor:pointer; transition:.15s}
.chip:hover{border-color:var(--line2); color:var(--ink)}
.chip .dot{width:7px; height:7px; border-radius:50%; background:var(--mute)}
.chip .dot.ok{background:var(--pass); box-shadow:0 0 9px var(--pass); animation:pulse 2.4s infinite}
.chip .dot.bad{background:var(--fail); box-shadow:0 0 9px var(--fail)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; font-family:var(--mono)}
.seg button{background:transparent; color:var(--mute); border:0; padding:6px 12px; font-size:11.5px;
  letter-spacing:1px; cursor:pointer; transition:.15s; font-family:inherit}
.seg button.on{background:var(--signal); color:#04221f; font-weight:700}
.seg button.on.demo{background:var(--council); color:#150b2e}
.seg button:disabled{opacity:.4; cursor:not-allowed}
.kbd{font-family:var(--mono); font-size:11px; color:var(--mute); border:1px solid var(--line2);
  border-radius:5px; padding:2px 6px}

.view{flex:1; min-height:0; overflow:auto; padding:22px 26px; scroll-behavior:smooth}
.view::-webkit-scrollbar{width:10px; height:10px}
.view::-webkit-scrollbar-thumb{background:var(--line2); border-radius:6px; border:2px solid var(--bg)}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--mute);
  text-transform:uppercase; margin-bottom:6px}

/* ── composer ─────────────────────────────────────────────────────────── */
.composer{background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2); border-radius:16px; padding:6px 6px 6px 18px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:12px; position:relative; overflow:hidden}
.composer::before{content:""; position:absolute; inset:0; border-radius:16px; padding:1px;
  background:linear-gradient(120deg,transparent,var(--signal-dim),transparent); opacity:.0;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; transition:.4s}
.composer:focus-within::before{opacity:.7}
.composer .lead{color:var(--signal); font-family:var(--mono); font-size:18px}
.composer input{flex:1; background:transparent; border:0; outline:0; color:var(--ink);
  font-size:16px; font-family:var(--body); padding:14px 0}
.composer input::placeholder{color:var(--mute)}
.runbtn{font-family:var(--disp); letter-spacing:1px; font-weight:700; font-size:14px;
  background:linear-gradient(135deg,var(--signal),#14b3b0); color:#042220; border:0;
  padding:13px 22px; border-radius:11px; cursor:pointer; display:flex; align-items:center; gap:8px;
  box-shadow:0 8px 22px -8px var(--signal); transition:.16s; white-space:nowrap}
.runbtn:hover{transform:translateY(-1px); filter:brightness(1.06)}
.runbtn:disabled{opacity:.5; cursor:not-allowed; transform:none; filter:grayscale(.4)}
.runbtn svg{width:15px;height:15px;fill:#042220}
.opts{display:flex; gap:8px; margin:14px 2px 0; flex-wrap:wrap}
.opt{font-family:var(--mono); font-size:11.5px; color:var(--mute); border:1px solid var(--line);
  background:var(--panel); padding:6px 11px; border-radius:20px; cursor:pointer; transition:.15s; user-select:none}
.opt:hover{border-color:var(--line2)}
.opt.on{color:var(--signal); border-color:#1c4a4a; background:#0a1c20}
.suggest{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.suggest button{font-size:12px; color:var(--ink2); background:var(--panel); border:1px dashed var(--line2);
  padding:7px 12px; border-radius:8px; cursor:pointer; transition:.15s; text-align:left}
.suggest button:hover{border-style:solid; border-color:var(--signal-dim); color:var(--ink)}

/* ── pillar rail ──────────────────────────────────────────────────────── */
.rail{display:grid; grid-template-columns:repeat(7,1fr); gap:0; margin:22px 0 6px; position:relative}
.rail::before{content:""; position:absolute; top:21px; left:7%; right:7%; height:2px;
  background:var(--line2); border-radius:2px}
.stage{display:flex; flex-direction:column; align-items:center; gap:9px; position:relative; z-index:1}
.stage .orb{width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  background:var(--panel); border:2px solid var(--line2); color:var(--mute); font-family:var(--mono);
  font-size:13px; font-weight:700; transition:.3s; position:relative}
.stage .lbl{font-size:10.5px; color:var(--mute); text-align:center; max-width:92px; line-height:1.25;
  font-family:var(--mono); letter-spacing:.3px; transition:.3s}
.stage .ms{font-size:10px; color:var(--faint); font-family:var(--mono); height:12px}
.stage.active .orb{border-color:var(--hue); color:var(--hue); background:#0c1018;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--hue) 18%,transparent), 0 0 22px -2px var(--hue);
  animation:breathe 1.3s ease-in-out infinite}
.stage.active .lbl{color:var(--hue)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--hue) 16%,transparent),0 0 18px -4px var(--hue)}
  50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--hue) 22%,transparent),0 0 30px 0 var(--hue)}}
.stage.done .orb{border-color:var(--hue); color:var(--hue); background:color-mix(in srgb,var(--hue) 14%,#0c1018)}
.stage.done .lbl{color:var(--ink2)}
.stage.skip .orb{opacity:.4; border-style:dashed}
.stage .orb .check{position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:.3s}
.stage.done .orb .check{opacity:1}
.stage.done .orb .idx{opacity:0}

/* ── studio body ──────────────────────────────────────────────────────── */
.studiogrid{display:grid; grid-template-columns:1fr 340px; gap:20px; margin-top:18px; align-items:start}
@media(max-width:1080px){.studiogrid{grid-template-columns:1fr}}
.feed{display:flex; flex-direction:column; gap:14px; min-height:120px}
.rightcol{display:flex; flex-direction:column; gap:16px; position:sticky; top:0}

.card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
  border-radius:14px; overflow:hidden; animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.card .ch{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line)}
.card .ch .ico{width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
  background:color-mix(in srgb,var(--hue) 16%,transparent); border:1px solid color-mix(in srgb,var(--hue) 40%,transparent)}
.card .ch .ico svg{width:14px;height:14px;stroke:var(--hue);fill:none;stroke-width:1.7}
.card .ch h3{font-family:var(--disp); font-size:14px; letter-spacing:.5px; font-weight:600; flex:1}
.card .ch .meta{font-family:var(--mono); font-size:11px; color:var(--mute)}
.card .cb{padding:14px 16px}
.barlabel{font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--mute); text-transform:uppercase}

/* BMAD stories */
.stories{display:grid; gap:8px}
.story{display:grid; grid-template-columns:30px 1fr auto; gap:10px; align-items:center;
  padding:9px 11px; background:var(--panel); border:1px solid var(--line); border-radius:9px; transition:.2s}
.story.run{border-color:var(--miras); box-shadow:inset 2px 0 0 var(--miras)}
.story.done{border-color:color-mix(in srgb,var(--pass) 40%,var(--line))}
.story .sid{font-family:var(--mono); color:var(--mute); font-size:12px; text-align:center}
.story .stt{font-size:13px}
.story .role{font-family:var(--mono); font-size:10px; letter-spacing:.5px; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap}
.story .prev{grid-column:2/4; font-size:12px; color:var(--ink2); border-top:1px dashed var(--line);
  margin-top:8px; padding-top:8px; display:none}
.story.done .prev{display:block}

/* council debate */
.persona{border:1px solid var(--line); border-left:3px solid var(--pc,var(--council)); border-radius:10px;
  padding:11px 13px; background:var(--panel); margin-bottom:9px; animation:rise .35s both}
.persona .ph{display:flex; align-items:center; gap:9px; margin-bottom:6px}
.persona .av{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--disp);
  font-weight:700;font-size:12px;background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc);
  border:1px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.persona .nm{font-weight:600; font-size:13px; flex:1; font-family:var(--disp); letter-spacing:.3px}
.persona .verdict{font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
  padding:2px 8px; border-radius:20px}
.v-pass{color:var(--pass); border:1px solid color-mix(in srgb,var(--pass) 45%,transparent); background:color-mix(in srgb,var(--pass) 12%,transparent)}
.v-fail{color:var(--fail); border:1px solid color-mix(in srgb,var(--fail) 45%,transparent); background:color-mix(in srgb,var(--fail) 12%,transparent)}
.v-cond{color:var(--concern); border:1px solid color-mix(in srgb,var(--concern) 45%,transparent); background:color-mix(in srgb,var(--concern) 12%,transparent)}
.persona .body{font-size:12.5px; color:var(--ink2)}
.persona .pts{margin:6px 0 0; padding-left:16px}
.persona .pts li{font-size:12px; color:var(--ink2); margin:2px 0}
.score-ring{--p:0; width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(var(--pc) calc(var(--p)*3.6deg), var(--line) 0); font-family:var(--mono);
  font-size:11px; font-weight:700; position:relative}
.score-ring::before{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--panel)}
.score-ring span{position:relative; z-index:1; color:var(--pc)}
.thinking{display:inline-flex; gap:4px; align-items:center; color:var(--mute); font-size:12px; font-family:var(--mono)}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--pc,var(--signal));animation:tk 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes tk{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* verdict banner */
.verdictbox{display:flex; align-items:center; gap:16px; padding:14px 16px;
  border-radius:12px; border:1px solid color-mix(in srgb,var(--pass) 40%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--pass) 10%,transparent),transparent)}
.verdictbox.fail{border-color:color-mix(in srgb,var(--concern) 40%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--concern) 10%,transparent),transparent)}
.bigscore{font-family:var(--disp); font-size:34px; font-weight:700; line-height:1}
.gate{font-family:var(--mono); font-size:11px; letter-spacing:2px; padding:4px 10px; border-radius:6px;
  text-transform:uppercase}

/* karpathy stream */
.thought{font-family:var(--mono); font-size:12px; color:var(--mute); background:#080b13;
  border:1px solid var(--line); border-radius:9px; padding:11px 13px; white-space:pre-wrap;
  max-height:0; overflow:hidden; transition:max-height .4s ease, padding .4s ease; padding-block:0}
.thought.open{max-height:340px; overflow:auto; padding-block:11px}
.thoughttoggle{font-family:var(--mono); font-size:11px; color:var(--karpathy); cursor:pointer; user-select:none}
.stream{font-size:14px; line-height:1.7}
.caret{display:inline-block; width:8px; height:16px; background:var(--signal); vertical-align:-3px;
  animation:blink 1s steps(1) infinite; margin-left:1px}
@keyframes blink{50%{opacity:0}}

/* final answer */
.final{border:1px solid var(--signal-dim);
  background:radial-gradient(140% 100% at 0% 0%, color-mix(in srgb,var(--signal) 8%,transparent), transparent 60%)}
.prose{font-size:14.5px; line-height:1.72; color:var(--ink)}
.prose h1{font-family:var(--disp);font-size:21px;margin:4px 0 12px;letter-spacing:.3px}
.prose h2{font-family:var(--disp);font-size:17px;margin:16px 0 8px}
.prose h3{font-size:14px;margin:12px 0 6px;color:var(--ink2)}
.prose p{margin:9px 0}.prose ul,.prose ol{margin:9px 0 9px 22px}.prose li{margin:4px 0}
.prose strong{color:#fff}.prose code{font-family:var(--mono);font-size:12.5px;background:#0a0e18;
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--signal)}
.prose em{color:var(--ink2)}
.prose a{color:var(--signal); text-decoration:none; border-bottom:1px dotted var(--signal-dim)}
.prose hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* right column instruments */
.inst{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
  border-radius:14px; overflow:hidden}
.inst .ih{display:flex; align-items:center; justify-content:space-between; padding:11px 14px;
  border-bottom:1px solid var(--line)}
.inst .ih b{font-family:var(--disp); font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink2); font-weight:600}
.inst .ih .c{font-family:var(--mono); font-size:11px; color:var(--mute)}
#miniGraphWrap{position:relative; height:240px}
#miniGraph{width:100%; height:100%; display:block}
.gtip{position:absolute; pointer-events:none; background:var(--raise); border:1px solid var(--line2);
  border-radius:7px; padding:5px 9px; font-size:11px; font-family:var(--mono); display:none; z-index:5; max-width:200px}
.memfeed{max-height:300px; overflow:auto; padding:8px}
.mem{border-left:2px solid var(--miras); padding:7px 10px; margin-bottom:7px; background:var(--panel);
  border-radius:0 8px 8px 0; animation:flashmem .8s ease}
@keyframes flashmem{0%{box-shadow:-3px 0 14px -2px var(--miras); background:#0c1a22}100%{box-shadow:none}}
.mem .mt{font-family:var(--mono); font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--miras)}
.mem .mtx{font-size:11.5px; color:var(--ink2); margin-top:2px}
.gates{display:flex; flex-direction:column; gap:8px; padding:12px 14px}
.gateline{display:flex; align-items:center; gap:10px; font-size:12px}
.gatedot{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.gatedot.pass{background:var(--pass);box-shadow:0 0 9px var(--pass)}
.gatedot.concern{background:var(--concern);box-shadow:0 0 9px var(--concern)}

/* empty state */
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:54px 20px; text-align:center; color:var(--mute); border:1px dashed var(--line2); border-radius:14px}
.empty .glyph{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#10243a,#0a1424);border:1px solid #1b3a52;
  box-shadow:0 0 36px -10px var(--signal)}
.empty .glyph svg{width:28px;height:28px;stroke:var(--signal);fill:none;stroke-width:1.4}

/* ── graph view ───────────────────────────────────────────────────────── */
.gview{display:grid; grid-template-columns:1fr 320px; gap:18px; height:calc(100vh - 130px)}
@media(max-width:900px){.gview{grid-template-columns:1fr}}
#fullGraphWrap{position:relative; border:1px solid var(--line); border-radius:14px; overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%, #0b1020, #07090f)}
#fullGraph{width:100%; height:100%; display:block}
.glegend{position:absolute; top:12px; left:12px; background:#0b0e16cc; border:1px solid var(--line);
  border-radius:9px; padding:9px 11px; font-size:11.5px; font-family:var(--mono)}
.glegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.nodepanel{border:1px solid var(--line); border-radius:14px; background:var(--panel); overflow:auto; padding:0}

/* ── chat view ────────────────────────────────────────────────────────── */
.chatwrap{max-width:860px; margin:0 auto; height:calc(100vh - 130px); display:flex; flex-direction:column}
.thread{flex:1; overflow:auto; display:flex; flex-direction:column; gap:16px; padding:6px 4px 18px}
.msg{display:flex; gap:12px; animation:rise .3s both}
.msg .who{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--disp);
  font-weight:700;font-size:13px}
.msg.user .who{background:#13243a;color:var(--signal);border:1px solid #1d3a52}
.msg.bot .who{background:color-mix(in srgb,var(--council) 16%,transparent);color:var(--council);border:1px solid color-mix(in srgb,var(--council) 40%,transparent)}
.msg .bubble{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 15px}
.msg.user .bubble{background:#0c1420}
.cites{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.cite{font-family:var(--mono); font-size:10.5px; color:var(--wiki); border:1px solid color-mix(in srgb,var(--wiki) 35%,transparent);
  background:color-mix(in srgb,var(--wiki) 10%,transparent); padding:3px 8px; border-radius:20px; cursor:pointer}
.chatbar{display:flex; gap:10px; padding:12px 0 4px; border-top:1px solid var(--line)}
.chatbar input{flex:1; background:var(--panel2); border:1px solid var(--line2); border-radius:11px;
  padding:13px 15px; color:var(--ink); font-size:15px; outline:0; font-family:var(--body)}
.chatbar input:focus{border-color:var(--signal-dim)}

/* ── runs / wiki / settings ───────────────────────────────────────────── */
.grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.runcard{background:var(--panel2); border:1px solid var(--line); border-radius:13px; padding:15px; cursor:pointer; transition:.18s}
.runcard:hover{border-color:var(--line2); transform:translateY(-2px); box-shadow:var(--shadow)}
.runcard .rg{font-size:14px; margin:8px 0 12px; line-height:1.4}
.runcard .rr{display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--mute)}
.pagecard{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; transition:.18s}
.pagecard:hover{border-color:var(--line2); transform:translateY(-2px)}
.ptype{font-family:var(--mono); font-size:9.5px; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:20px}
.t-entity{color:var(--miras);border:1px solid color-mix(in srgb,var(--miras) 40%,transparent)}
.t-concept{color:var(--pass);border:1px solid color-mix(in srgb,var(--pass) 40%,transparent)}
.t-synthesis{color:var(--concern);border:1px solid color-mix(in srgb,var(--concern) 40%,transparent)}
.t-source{color:var(--mute);border:1px solid var(--line2)}
.t-query{color:var(--council);border:1px solid color-mix(in srgb,var(--council) 40%,transparent)}
.t-page{color:var(--ink2);border:1px solid var(--line2)}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 16px;
  border:1px solid var(--line); border-radius:11px; background:var(--panel2); margin-bottom:11px}
.setrow .k{font-weight:600}.setrow .d{font-size:12px;color:var(--mute);margin-top:2px}
select,.ti{background:var(--panel); border:1px solid var(--line2); border-radius:9px; color:var(--ink);
  padding:9px 12px; font-family:var(--mono); font-size:13px; outline:0}
.btn{background:var(--signal); color:#042220; border:0; border-radius:9px; padding:9px 16px; font-weight:700;
  font-family:var(--disp); letter-spacing:.5px; cursor:pointer; transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; color:var(--ink2); border:1px solid var(--line2)}
.metricgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.metric{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 14px}
.metric .mv{font-family:var(--disp); font-size:24px; font-weight:700; color:var(--signal)}
.metric .mk{font-family:var(--mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--mute)}
.accentdots{display:flex; gap:8px}
.accentdots .ad{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.accentdots .ad.on{border-color:#fff}

/* toast + palette */
#toasts{position:fixed; bottom:20px; right:20px; z-index:60; display:flex; flex-direction:column; gap:9px}
.toast{background:var(--raise); border:1px solid var(--line2); border-left:3px solid var(--signal);
  border-radius:9px; padding:11px 15px; font-size:13px; box-shadow:var(--shadow); animation:rise .3s both; max-width:320px}
.palette{position:fixed; inset:0; z-index:70; background:#04060ccc; display:none; align-items:flex-start; justify-content:center; padding-top:14vh}
.palette.open{display:flex}
.palbox{width:min(560px,92vw); background:var(--panel2); border:1px solid var(--line2); border-radius:14px;
  box-shadow:var(--shadow); overflow:hidden}
.palbox input{width:100%; background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--ink);
  padding:16px 18px; font-size:16px; outline:0; font-family:var(--body)}
.palbox .opt2{padding:12px 18px; display:flex; align-items:center; gap:12px; cursor:pointer; font-size:14px}
.palbox .opt2:hover,.palbox .opt2.sel{background:var(--panel)}
.palbox .opt2 .pk{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--mute)}
.hide{display:none!important}

/* keyboard focus — visible on every interactive element */
.navbtn:focus-visible, button:focus-visible, select:focus-visible,
input:focus-visible, [tabindex]:focus-visible, .pagecard:focus-visible, .runcard:focus-visible{
  outline:2px solid var(--signal); outline-offset:2px; border-radius:8px}
.brand:focus-visible{outline:2px solid var(--signal); outline-offset:3px}

/* respect reduced-motion: kill all non-essential animation + transitions */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.001ms!important; animation-iteration-count:1!important;
    transition-duration:.001ms!important; scroll-behavior:auto!important}
  .aurora{transition:none}
  #stars{opacity:.35}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="aurora" id="aur1"></div>
<div class="aurora" id="aur2"></div>
<div id="app"></div>
<div id="toasts"></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command palette"><div class="palbox">
  <input id="palInput" aria-label="Command or goal" placeholder="Jump to… or type a goal to run">
  <div id="palList" role="listbox"></div>
</div></div>
<script>
"use strict";
/* ══════════════ config ══════════════ */
const PILLARS = {
  bmad:{hue:"#f5a623",label:"BMAD"}, council:{hue:"#a78bfa",label:"Council"},
  openplanter:{hue:"#fb923c",label:"OpenPlanter"}, miras:{hue:"#22d3ee",label:"Miras"},
  karpathy:{hue:"#fb7185",label:"Karpathy"}, wiki:{hue:"#34d399",label:"Wiki"}, system:{hue:"#34e7e4",label:"System"}
};
const STAGES = [
  {idx:1,pillar:"bmad",label:"BMAD · Backlog"},
  {idx:2,pillar:"council",label:"Council · Brainstorm"},
  {idx:3,pillar:"openplanter",label:"OpenPlanter · Investigate"},
  {idx:4,pillar:"miras",label:"Miras · Execute"},
  {idx:5,pillar:"karpathy",label:"Karpathy · Refine"},
  {idx:6,pillar:"council",label:"Council · QA Gate"},
  {idx:7,pillar:"wiki",label:"Wiki · Graph"},
];
const ICONS = {
  studio:'<path d="M3 12h4l3-8 4 16 3-8h4"/>', chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  graph:'<circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M8 7l8 1M7 8l4 8M16 10l-3 6"/>',
  runs:'<path d="M5 4v16M5 7h13l-2.5 3L18 13H5"/>', wiki:'<path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.5 5.5l2 2M16.5 16.5l2 2M18.5 5.5l-2 2M7.5 16.5l-2 2"/>',
  skills:'<path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/>',
  spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>', play:'<path d="M8 5v14l11-7z"/>'
};
const NAV=[["studio","Studio"],["chat","Chat"],["graph","Graph"],["runs","Runs"],["skills","Skills"],["wiki","Wiki"],["settings","Settings"]];
const SKILL_HUE="#fbbf24";

/* ══════════════ state ══════════════ */
const S = {
  view:"studio", mode:"demo", server:false, canLive:false, config:null,
  busy:false, run:null, runs:[], graph:{nodes:[],links:[]}, pages:[], memories:[], skills:[],
  chat:[], opts:{parallel:false, self_critique:true, skip_council:false, skip_wiki:false}, accent:"#34e7e4"
};
const API = location.protocol.startsWith("http") ? location.origin : "";

/* ══════════════ dom helpers ══════════════ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(k==="class")e.className=v; else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(v!=null)e.setAttribute(k,v);}
  for(const k of kids.flat()){if(k==null)continue; e.append(k.nodeType?k:document.createTextNode(k));}
  return e;}
const svg=(p,cls="")=>`<svg class="${cls}" viewBox="0 0 24 24">${p}</svg>`;
function toast(msg){const t=el("div",{class:"toast"},msg); $("#toasts").append(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transform="translateX(20px)";t.style.transition=".4s";setTimeout(()=>t.remove(),400)},3200);}
function setAurora(hue){document.documentElement.style.setProperty("--aurora",hue);}

/* tiny markdown */
function md(src){if(!src)return"";
  let h=src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines=h.split("\n"); let out=[],list=null;
  const safeHref=h=>{h=h.trim(); return /^(https?:|#|\/)/i.test(h)?h.replace(/"/g,"%22"):null;};
  const inl=t=>t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[\[([^\]]+)\]\]/g,(m,p)=>`<a data-wiki="${p.replace(/"/g,"&quot;")}">${p}</a>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,txt,href)=>{const h=safeHref(href); return h?`<a href="${h}" rel="noopener noreferrer">${txt}</a>`:txt;});
  for(let ln of lines){
    if(/^\s*$/.test(ln)){if(list){out.push(`</${list}>`);list=null}continue;}
    let m;
    if(m=ln.match(/^###\s+(.*)/)){if(list){out.push(`</${list}>`);list=null}out.push(`<h3>${inl(m[1])}</h3>`);continue;}
    if(m=ln.match(/^##\s+(.*)/)){if(list){out.push(`</${list}>`);list=null}out.push(`<h2>${inl(m[1])}</h2>`);continue;}
    if(m=ln.match(/^#\s+(.*)/)){if(list){out.push(`</${list}>`);list=null}out.push(`<h1>${inl(m[1])}</h1>`);continue;}
    if(/^\s*---\s*$/.test(ln)){out.push("<hr>");continue;}
    if(m=ln.match(/^\s*\d+\.\s+(.*)/)){if(list!=="ol"){if(list)out.push(`</${list}>`);out.push("<ol>");list="ol"}out.push(`<li>${inl(m[1])}</li>`);continue;}
    if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(list!=="ul"){if(list)out.push(`</${list}>`);out.push("<ul>");list="ul"}out.push(`<li>${inl(m[1])}</li>`);continue;}
    out.push(`<p>${inl(ln)}</p>`);
  }
  if(list)out.push(`</${list}>`);
  return out.join("");}

/* ══════════════ boot ══════════════ */
async function boot(){
  buildStars();
  try{const r=await fetch(API+"/health",{cache:"no-store"}); if(r.ok){const h=await r.json();
    S.server=true; S.canLive=h.can_run_live; S.mode=h.can_run_live?"live":"demo";}}catch(e){S.server=false;}
  await loadData();
  renderShell(); route();
  window.addEventListener("hashchange",route);
  window.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();togglePalette(true);}
    if(e.key==="Escape")togglePalette(false);});
}
async function loadData(){
  if(S.server){
    try{const [g,p,m,c,sk]=await Promise.all([
      fetch(API+"/wiki/graph").then(r=>r.json()),
      fetch(API+"/wiki/pages").then(r=>r.json()),
      fetch(API+"/memories").then(r=>r.json()),
      fetch(API+"/config").then(r=>r.json()),
      fetch(API+"/skills").then(r=>r.json()).catch(()=>({skills:[]}))]);
      S.graph=g; S.pages=p.pages||[]; S.memories=m.memories||[]; S.config=c; S.skills=sk.skills||[];
      try{S.runs=await fetch(API+"/runs").then(r=>r.json());}catch(e){}
    }catch(e){console.warn(e);}
  } else {
    // static mode — fetch bundled snapshots
    const get=async f=>{try{return await fetch("studio/"+f).then(r=>r.json())}catch(e){return null}};
    S.graph=await get("wiki_graph.json")||{nodes:[],links:[]};
    S.pages=await get("wiki_pages.json")||[];
    S.memories=await get("memories.json")||[];
    S.skills=await get("skills.json")||[];
    S.config={backend:"static",model:"—",backends:["claude","openai","openrouter","ollama","vllm","lmstudio"],models:{},can_run_live:false,default_mode:"demo"};
  }
}

/* ══════════════ shell ══════════════ */
function renderShell(){
  const nav=el("nav",{role:"navigation","aria-label":"Primary"},
    el("button",{class:"brand","aria-label":"m1frame — go to Studio",onclick:()=>go("studio")}, el("b",{},"m1")),
    ...NAV.map(([id,label])=>el("button",{class:"navbtn","data-nav":id,"aria-label":label,onclick:()=>go(id),html:
      svg(ICONS[id])+`<span class="tip">${label}</span>`})),
    el("div",{class:"navspacer"}),
    el("button",{class:"navbtn",id:"palbtn","aria-label":"Command palette (Ctrl or Cmd + K)","aria-expanded":"false",onclick:()=>togglePalette(true),html:svg(ICONS.spark)+'<span class="tip">⌘K</span>'})
  );
  const liveAttrs={class:"live"+(S.mode==="live"?" on":""),"aria-label":"Live mode",onclick:()=>setMode("live")};
  if(!S.canLive){liveAttrs.disabled=""; liveAttrs.title="Set ANTHROPIC_API_KEY for live runs"; liveAttrs["aria-disabled"]="true";}
  const modeSeg = el("div",{class:"seg",role:"group","aria-label":"Run mode"},
    el("button",liveAttrs,"LIVE"),
    el("button",{class:"demo"+(S.mode==="demo"?" on demo":""),"aria-label":"Demo mode",onclick:()=>setMode("demo")},"DEMO"));
  const head=el("header",{role:"banner"},
    el("div",{class:"word",html:'m1<span>frame</span><span class="st">STUDIO</span>'}),
    el("div",{class:"tag"},"a council that deliberates · grounds · remembers"),
    el("div",{class:"spacer"}),
    el("button",{class:"chip","aria-label":"Settings — backend "+(S.config?S.config.backend:''),onclick:()=>go("settings"),html:`<span class="dot ${S.server?'ok':''}"></span>${S.config?S.config.backend:'…'}`}),
    modeSeg,
    el("span",{class:"kbd"},"⌘K"));
  const app=$("#app"); app.innerHTML=""; app.append(nav,el("main",{},head,el("div",{class:"view",id:"view"})));
  // staggered nav reveal
  $$(".navbtn").forEach((b,i)=>{b.style.opacity=0;b.style.transform="translateX(-8px)";
    setTimeout(()=>{b.style.transition=".3s";b.style.opacity=1;b.style.transform="none";},60+i*45);});
}
function go(v){location.hash=v;}
function route(){
  S.view=(location.hash.slice(1)||"studio");
  $$(".navbtn").forEach(b=>{const on=b.dataset.nav===S.view; b.classList.toggle("on",on);
    if(on)b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");});
  const v=$("#view"); v.scrollTop=0;
  ({studio:viewStudio,chat:viewChat,graph:viewGraph,runs:viewRuns,skills:viewSkills,wiki:viewWiki,settings:viewSettings}[S.view]||viewStudio)(v);
}
function setMode(m){ if(m==="live"&&!S.canLive){toast("No API key detected — staying in DEMO. Add ANTHROPIC_API_KEY for live runs.");return;}
  S.mode=m; $$(".seg button").forEach(b=>b.classList.remove("on","demo"));
  $(".seg button."+m).classList.add("on"); if(m==="demo")$(".seg button.demo").classList.add("demo");}

/* ══════════════ STUDIO view ══════════════ */
function viewStudio(v){
  v.innerHTML="";
  const composer=el("div",{},
    el("div",{class:"eyebrow"},"COMMAND"),
    el("div",{class:"composer"},
      el("span",{class:"lead"},"▸"),
      el("input",{id:"goal",placeholder:"What should the council deliberate, build, or investigate?",
        onkeydown:e=>{if(e.key==="Enter")startRun();}}),
      el("button",{class:"runbtn",id:"runbtn",onclick:startRun,html:svg(ICONS.play)+"<span>RUN</span>"})),
    el("div",{class:"opts"},
      ...[["parallel","parallel"],["self_critique","self-critique"],["skip_council","skip council"],["skip_wiki","skip wiki"]]
        .map(([k,lbl])=>el("div",{class:"opt"+(S.opts[k]?" on":""),onclick:e=>{S.opts[k]=!S.opts[k];e.target.classList.toggle("on");}},lbl))),
    el("div",{class:"suggest"},
      ...["Should we manufacture an analog optical chip or a digital ternary ASIC?",
          "Design a FastAPI service with JWT auth and rate limiting",
          "Investigate vendor payments against lobbying disclosures"]
        .map(s=>el("button",{onclick:()=>{$("#goal").value=s;startRun();}},s))));
  // pillar rail
  const rail=el("div",{class:"rail",id:"rail"});
  STAGES.forEach(st=>{const hue=PILLARS[st.pillar].hue;
    rail.append(el("div",{class:"stage",id:"stage-"+st.idx,style:{"--hue":hue}},
      el("div",{class:"orb"}, el("span",{class:"idx"},String(st.idx)),
        el("span",{class:"check",html:svg('<path d="M5 13l4 4 10-10" stroke="'+hue+'"/>')})),
      el("div",{class:"lbl"},st.label),
      el("div",{class:"ms",id:"ms-"+st.idx})));});
  // body
  const feed=el("div",{class:"feed",id:"feed"});
  feed.append(emptyState());
  const right=el("div",{class:"rightcol"},
    el("div",{class:"inst"},
      el("div",{class:"ih"}, el("b",{},"Knowledge Graph"), el("span",{class:"c",id:"gcount"},S.graph.nodes.length+" nodes")),
      el("div",{id:"miniGraphWrap"}, el("canvas",{id:"miniGraph"}), el("div",{class:"gtip",id:"gtip"}))),
    el("div",{class:"inst"},
      el("div",{class:"ih"}, el("b",{},"QA Gates"), el("span",{class:"c"},"consensus ≥ 7")),
      el("div",{class:"gates",id:"gates"},
        gateLine("Roadmap review"), gateLine("Results review"))),
    el("div",{class:"inst"},
      el("div",{class:"ih"}, el("b",{},"miras Memory"), el("span",{class:"c",id:"memcount"},S.memories.length+" stored")),
      el("div",{class:"memfeed",id:"memfeed"})));
  v.append(composer,rail,el("div",{class:"studiogrid"},feed,right));
  // init mini graph + seed memory feed
  miniGraph=new Graph($("#miniGraph"),$("#gtip"),false);
  miniGraph.set(S.graph.nodes.slice(0,14),S.graph.links);
  const mf=$("#memfeed"); S.memories.slice(0,6).forEach(m=>mf.append(memItem(m,false)));
  if(S.run) replayInto(S.run.events); // restore last run if returning to view
  setRunBtn(S.busy);                  // reflect an in-flight run on the fresh button
}
function emptyState(){return el("div",{class:"empty"},
  el("div",{class:"glyph",html:svg(ICONS.spark)}),
  el("div",{html:'<b style="color:var(--ink2);font-family:var(--disp);font-size:16px;letter-spacing:.5px">The council is ready.</b>'}),
  el("div",{},"Type a goal above and press RUN. Watch BMAD plan it, the Council debate it, Miras execute it, and the knowledge graph grow — live."));}
function gateLine(name){return el("div",{class:"gateline","data-gate":name},
  el("span",{class:"gatedot"}), el("span",{},name), el("span",{class:"c",style:{marginLeft:"auto",fontFamily:"var(--mono)",fontSize:"11px",color:"var(--mute)"}},"pending"));}
function memItem(m,flash){const e=el("div",{class:"mem"+(flash?"":"")},
  el("div",{class:"mt"},(m.type||"memory")+(m.agent?" · "+m.agent:"")),
  el("div",{class:"mtx"},m.text||""));
  if(!flash)e.style.animation="none"; return e;}

/* ══════════════ run orchestration ══════════════ */
let miniGraph=null, runState=null;
function resetRun(goal){
  runState={goal,events:[],pillarCards:{},councilCard:null,storyMap:{},streamEl:null,streamText:""};
  S.run=runState;
  $("#feed").innerHTML="";
  STAGES.forEach(st=>{const s=$("#stage-"+st.idx); if(s){s.classList.remove("active","done","skip");$("#ms-"+st.idx).textContent="";}});
  $$(".gateline").forEach(g=>{g.querySelector(".gatedot").className="gatedot";g.querySelector(".c").textContent="pending";});
}
async function startRun(goal){
  if(S.busy)return;
  const goalEl=$("#goal");
  goal = (typeof goal==="string"?goal:null) || (goalEl?goalEl.value.trim():"");
  if(!goal){toast("Enter a goal first.");return;}
  S.busy=true; setRunBtn(true);
  resetRun(goal);
  try{
    if(S.server){
      const body={goal,mode:S.mode,speed:S.mode==="demo"?2:1,...S.opts};
      const r=await fetch(API+"/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
      await streamSSE(API+"/run/"+r.run_id+"/events",null,onEvent);
    } else {
      const fx=await fetch("studio/demo_run.json").then(r=>r.json());
      await replayFixture(fx.events);
    }
  }catch(e){toast("Run failed: "+e.message); console.error(e);}
  finally{S.busy=false; setRunBtn(false);}
}
function setRunBtn(running){const rb=$("#runbtn"); if(!rb)return;   // always re-query (survives view re-render)
  rb.disabled=running; const s=rb.querySelector("span"); if(s)s.textContent=running?"RUNNING":"RUN";}
function replayFixture(events){return new Promise(res=>{ let i=0;
  const tick=()=>{ if(i>=events.length)return res();
    const ev={...events[i++]}; const d=Math.min((ev.delay_ms||0)/2,900); delete ev.delay_ms;
    onEvent(ev); setTimeout(tick, d); };
  tick(); });}
function replayInto(events){ /* instant re-render of a stored run when revisiting */
  events.forEach(ev=>onEvent({...ev,_instant:true})); }

async function streamSSE(url,body,cb){
  const opt={method:body?"POST":"GET",headers:{}}; if(body){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body);}
  const resp=await fetch(url,opt); const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
  while(true){const {done,value}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true});
    let parts=buf.split("\n\n"); buf=parts.pop();
    for(const p of parts){const ln=p.split("\n").find(x=>x.startsWith("data: ")); if(!ln)continue;
      let ev; try{ev=JSON.parse(ln.slice(6));}catch(e){continue;}
      cb(ev); if(ev.type==="done"||ev.type==="error")return;}}
}

/* the event renderer — one switch for live, demo, and replay */
function onEvent(ev){
  if(runState && !ev._instant) runState.events.push(ev);
  const F=$("#feed"); if(!F)return;
  switch(ev.type){
    case "run_start": setAurora(PILLARS.system.hue); break;
    case "pillar_start":{ const st=$("#stage-"+ev.idx);
      STAGES.forEach(s=>{const n=$("#stage-"+s.idx); if(n&&n.classList.contains("active")){n.classList.remove("active");n.classList.add("done");}});
      if(st){st.classList.add("active"); setAurora(PILLARS[ev.pillar]?.hue||PILLARS.system.hue);} break;}
    case "pillar_done":{ const idx=stageIdxFor(ev); const st=idx&&$("#stage-"+idx);
      if(st){st.classList.remove("active");st.classList.add("done");} if(ev.ms)$("#ms-"+idx)&&($("#ms-"+idx).textContent=(ev.ms/1000).toFixed(1)+"s"); break;}
    case "pillar_skipped":{ const st=$("#stage-"+ev.idx); if(st)st.classList.add("skip"); break;}
    case "bmad_blueprint": renderBlueprint(ev); break;
    case "story_start": case "story_done": renderStory(ev); break;
    case "council_persona_start": ensureCouncil(ev.mode); councilThinking(ev.persona); break;
    case "council_persona": renderPersona(ev); break;
    case "council_brainstorm": renderBrainstorm(ev); break;
    case "openplanter_result": renderOpenplanter(ev); break;
    case "karpathy_token": streamToken(ev.chunk); break;
    case "karpathy_done": finishStream(ev); break;
    case "council_verdict": renderVerdict(ev); break;
    case "qa_gate": markGate(ev); break;
    case "graph_delta": applyGraphDelta(ev); break;
    case "wiki_page": addMemoryPulse({type:ev.page_type,agent:"wiki",text:ev.title}); break;
    case "memory_added": addMemoryPulse({type:ev.type_||ev.type,agent:ev.agent,text:ev.text}); break;
    case "skill_suggested": renderSkillEvent(ev,"suggested"); break;
    case "skill_learned": renderSkillEvent(ev,"learned"); break;
    case "final": renderFinal(ev); break;
    case "error": toast("Pipeline error: "+ev.message); break;
    case "done": setAurora(PILLARS.system.hue); if(S.server&&!ev._instant)refreshSidecars(); break;
  }
  if(!ev._instant) F.scrollTop=F.scrollHeight;
}

/* ══════════════ force-graph engine ══════════════ */
class Graph{
  constructor(canvas,tip,big){this.cv=canvas;this.ctx=canvas.getContext("2d");this.tip=tip;this.big=big;
    this.N=[];this.L=[];this.idx={};this.hover=null;this.drag=null;this.onpick=null;
    this._reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches; this._settle=260;
    this.size();
    addEventListener("resize",()=>this.size());
    canvas.addEventListener("mousemove",e=>this.move(e));
    canvas.addEventListener("mousedown",()=>{if(this.hover)this.drag=this.hover;});
    addEventListener("mouseup",()=>{this.drag=null;});
    canvas.addEventListener("click",()=>{if(this.hover&&this.onpick)this.onpick(this.hover);});
    if(!Graph._loop){Graph._all=[];Graph._loop=true;const tick=()=>{Graph._all.forEach(g=>g.frame());requestAnimationFrame(tick);};tick();}
    Graph._all.push(this);}
  size(){const r=this.cv.getBoundingClientRect();this.W=this.cv.width=r.width*devicePixelRatio;this.H=this.cv.height=r.height*devicePixelRatio;
    this.ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);this.w=r.width;this.h=r.height;}
  set(nodes,links){this.N=nodes.map(n=>({...n,x:this.w/2+(Math.random()-.5)*200,y:this.h/2+(Math.random()-.5)*160,vx:0,vy:0}));
    this.idx={};this.N.forEach((n,i)=>this.idx[n.id]=i);this.L=links.filter(l=>this.idx[l.source]!=null&&this.idx[l.target]!=null).map(l=>({...l}));}
  addNode(n){if(this.idx[n.id]!=null)return;const nn={...n,x:this.w/2+(Math.random()-.5)*120,y:this.h/2+(Math.random()-.5)*120,vx:0,vy:0,_pop:1};
    this.idx[n.id]=this.N.length;this.N.push(nn);}
  addLink(l){if(this.idx[l.source]!=null&&this.idx[l.target]!=null)this.L.push({...l});}
  col(t){return PILLARS_TYPECOL[t]||"#8b97b3";}
  frame(){const ctx=this.ctx;if(!this.N.length){ctx.clearRect(0,0,this.w,this.h);return;}
    for(let i=0;i<this.N.length;i++){const a=this.N[i];
      for(let j=i+1;j<this.N.length;j++){const b=this.N[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
        const f=(this.big?2200:1500)/d2,fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
      a.vx+=(this.w/2-a.x)*.0017;a.vy+=(this.h/2-a.y)*.0017;}
    this.L.forEach(l=>{const a=this.N[this.idx[l.source]],b=this.N[this.idx[l.target]];if(!a||!b)return;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;const f=(d-(this.big?110:80))*.02,fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;});
    if(this._reduce && this._settle<=0){
      // reduced-motion: layout has settled — freeze positions (no perpetual motion)
      this.N.forEach(n=>{n.vx=0;n.vy=0;});
    } else {
      this.N.forEach(n=>{if(n===this.drag)return;n.vx*=.85;n.vy*=.85;n.x+=n.vx;n.y+=n.vy;
        n.x=Math.max(18,Math.min(this.w-18,n.x));n.y=Math.max(16,Math.min(this.h-16,n.y));if(n._pop)n._pop*=.92;});
      if(this._reduce)this._settle--;
    }
    ctx.clearRect(0,0,this.w,this.h);
    ctx.lineWidth=1;this.L.forEach(l=>{const a=this.N[this.idx[l.source]],b=this.N[this.idx[l.target]];if(!a||!b)return;
      const hl=this.hover&&(a===this.hover||b===this.hover);ctx.strokeStyle=hl?"#34e7e466":"#26304a";ctx.globalAlpha=hl?1:.5;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});
    ctx.globalAlpha=1;
    this.N.forEach(n=>{const deg=this.L.filter(l=>l.source===n.id||l.target===n.id).length;
      const r=(this.big?6:4)+Math.min(deg,7)*(this.big?1.1:.7)+(n._pop?n._pop*6:0);
      ctx.fillStyle=this.col(n.type);ctx.shadowColor=this.col(n.type);ctx.shadowBlur=n===this.hover?16:(this.big?8:5);
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();ctx.shadowBlur=0;
      if(n===this.hover){ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();}
      if(this.big||n===this.hover){ctx.fillStyle="#cdd6ea";ctx.font="11px ui-monospace,monospace";ctx.textAlign="center";
        ctx.fillText(n.id,n.x,n.y-r-5);}});
  }
  move(e){const r=this.cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
    if(this.drag){this.drag.x=mx;this.drag.y=my;this.drag.vx=this.drag.vy=0;}
    let best=null,bd=this.big?500:240;this.N.forEach(n=>{const d=(n.x-mx)**2+(n.y-my)**2;if(d<bd){bd=d;best=n;}});
    this.hover=best;
    if(this.tip){if(best){this.tip.style.display="block";this.tip.style.left=(mx+12)+"px";this.tip.style.top=(my+8)+"px";
      this.tip.innerHTML="<b>"+best.id+"</b><br>"+(best.type||"");}else this.tip.style.display="none";}
    this.cv.style.cursor=best?"pointer":"default";}
}

    el("div",{class:"suggest",style:{justifyContent:"center"}},
      ...["Why choose digital ternary over analog optics?","What did the council decide about the chip?","Summarise the OPU feasibility verdict."]
        .map(s=>el("button",{onclick:()=>sendChat(s)},s)))));}
  else S.chat.forEach(m=>thread.append(chatMsg(m)));
  const bar=el("div",{class:"chatbar"},
    el("input",{id:"chatin",placeholder:"Message m1frame…",onkeydown:e=>{if(e.key==="Enter")sendChat();}}),
    el("button",{class:"btn",onclick:()=>sendChat()},"Send"));
  v.append(el("div",{class:"chatwrap"},thread,bar));
  thread.scrollTop=thread.scrollHeight; $("#chatin")?.focus();
}
function chatMsg(m){return el("div",{class:"msg "+m.role},
  el("div",{class:"who"},m.role==="user"?"you":"m1"),
  el("div",{class:"bubble"}, el("div",{class:"prose",html:md(m.content)}),
    m.cites&&m.cites.length?el("div",{class:"cites"},...m.cites.map(c=>el("span",{class:"cite",onclick:()=>{go("wiki");setTimeout(()=>openPage(c),60);}},c))):null));}
async function sendChat(text){
  text=(typeof text==="string"?text:null)||$("#chatin")?.value.trim(); if(!text)return;
  S.chat.push({role:"user",content:text}); const bot={role:"bot",content:"",cites:[]}; S.chat.push(bot);
  viewChat($("#view")); const thread=$("#thread");
  const botEl=thread.lastChild; const prose=botEl.querySelector(".prose"); prose.innerHTML='<span class="thinking"><i></i><i></i><i></i></span>';
  try{
    if(S.server){
      let buf="";
      await streamSSE(API+"/chat",{message:text,ground:true},ev=>{
        if(ev.type==="token"){buf+=ev.chunk;prose.innerHTML=md(buf);thread.scrollTop=thread.scrollHeight;}
        else if(ev.type==="done"){bot.content=buf;bot.cites=ev.citations||[];}
        else if(ev.type==="error"){buf+="\n\n_(error: "+ev.message+")_";prose.innerHTML=md(buf);}});
    } else {
      const ans=keywordAnswer(text); bot.cites=ans.citations;
      await typewriter(ans.answer,t=>{prose.innerHTML=md(t);thread.scrollTop=thread.scrollHeight;}); bot.content=ans.answer;
    }
  }catch(e){bot.content="_(failed: "+e.message+")_";}
  bot.content=bot.content||"_(no response)_"; viewChat($("#view"));
}
function typewriter(text,cb){return new Promise(res=>{const toks=text.match(/\S+\s*/g)||[text];let i=0,acc="";
  const t=()=>{if(i>=toks.length)return res();acc+=toks[i++];cb(acc);setTimeout(t,14);};t();});}
function keywordAnswer(q){const qs=new Set((q.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>w.length>2));
  const scored=S.pages.map(p=>{const hay=(p.title+" "+(p.body||"")).toLowerCase();
    return {p,s:[...qs].reduce((a,w)=>a+(hay.split(w).length-1),0)};}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
  if(!scored.length)return{answer:"No grounded match in the knowledge graph yet. Try a run first.",citations:[]};
  return{answer:scored.map(({p})=>{const first=(p.body||"").split("\n").find(l=>l.trim()&&!/^[#\-|]/.test(l.trim()))||"";
    return "**"+p.title+"** — "+first;}).join("\n\n"),citations:scored.map(x=>x.p.title)};}

/* ══════════════ RUNS view ══════════════ */
function viewRuns(v){v.innerHTML="";
  v.append(el("div",{class:"eyebrow"},"RUN HISTORY"),
    el("h2",{style:{fontFamily:"var(--disp)",fontSize:"20px",marginBottom:"16px"}},(S.runs.length||0)+" runs"));
  if(!S.runs.length){v.append(el("div",{class:"empty"},
    el("div",{class:"glyph",html:svg(ICONS.runs)}),
    el("div",{},"No runs yet. Head to Studio and run a goal — it'll appear here, fully replayable.")));return;}
  const grid=el("div",{class:"grid2"});
  S.runs.forEach(r=>grid.append(el("div",{class:"runcard",onclick:()=>replayRun(r)},
    el("span",{class:"ptype "+(r.status==="complete"?"t-concept":"t-source")},r.status||"—"),
    el("div",{class:"rg"},r.goal),
    el("div",{class:"rr"}, el("span",{},r.score!=null?("◆ "+(r.score.toFixed?r.score.toFixed(1):r.score)+"/10"):"—"),

async function replayRun(r){go("studio");
  setTimeout(async()=>{ resetRun(r.goal); $("#goal")&&($("#goal").value=r.goal);
    let events=r.events;
    if(!events&&S.server){try{events=(await fetch(API+"/run/"+r.run_id).then(x=>x.json())).events;}catch(e){}}
    (events||[]).forEach(ev=>onEvent({...ev,_instant:true}));
    toast("Replayed run · "+(r.score!=null?r.score+"/10":"")); },80);}

/* ══════════════ SKILLS view ══════════════ */
function viewSkills(v){v.innerHTML="";

  const grid=el("div",{class:"grid2"}); S.skills.forEach(s=>grid.append(skillCard(s))); v.append(grid);}
function skillCard(s){const score=(s.score&&s.score.toFixed)?s.score.toFixed(1):s.score;

/* ══════════════ WIKI view ══════════════ */
function viewWiki(v){v.innerHTML="";
  v.append(el("div",{class:"eyebrow"},"KNOWLEDGE BASE"),
    el("div",{style:{display:"flex",gap:"12px",alignItems:"center",marginBottom:"16px"}},
      el("h2",{style:{fontFamily:"var(--disp)",fontSize:"20px",flex:"1"}},S.pages.length+" pages"),
      el("input",{class:"ti",id:"wikisearch",placeholder:"search…",style:{width:"240px"},oninput:e=>filterWiki(e.target.value)})));
  const grid=el("div",{class:"grid2",id:"wikigrid"}); v.append(grid); renderWikiCards(S.pages,grid);}
function renderWikiCards(pages,grid){grid.innerHTML="";
  pages.forEach(p=>grid.append(el("div",{class:"pagecard",onclick:()=>openPage(p.title)},
    el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"9px"}},

    el("div",{style:{fontFamily:"var(--disp)",fontSize:"15px",marginBottom:"6px"}},p.title),
    el("div",{style:{fontSize:"12px",color:"var(--mute)",display:"-webkit-box","-webkit-line-clamp":"2","-webkit-box-orient":"vertical",overflow:"hidden"}},
      (p.body||"").replace(/[#*`>|\-]/g," ").slice(0,140)))));}
function filterWiki(q){q=q.toLowerCase();const f=S.pages.filter(p=>(p.title+" "+(p.body||"")).toLowerCase().includes(q));renderWikiCards(f,$("#wikigrid"));}
function openPage(title){const p=S.pages.find(x=>x.title===title); if(!p){go("wiki");return;}
  const v=$("#view"); v.innerHTML="";
  v.append(el("button",{class:"btn ghost",style:{marginBottom:"16px"},onclick:()=>go("wiki")},"← all pages"),
    el("div",{style:{maxWidth:"760px"}},
      el("span",{class:"ptype t-"+(p.type||"page")},p.type||"page"),
      el("h1",{style:{fontFamily:"var(--disp)",fontSize:"26px",margin:"12px 0 6px"}},p.title),
      p.tags&&p.tags.length?el("div",{style:{display:"flex",gap:"6px",marginBottom:"16px",flexWrap:"wrap"}},
        ...p.tags.map(t=>el("span",{class:"cite"},t))):null,
      el("div",{class:"prose",html:md(p.body||"")})));
  wireWikiLinks(v); window.scrollTo&&v.scrollTo(0,0);}
function wireWikiLinks(root){$$('a[data-wiki]',root).forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go("wiki");setTimeout(()=>openPage(a.dataset.wiki),60);}));}

/* ══════════════ SETTINGS view ══════════════ */

  // metrics

  loadMetrics(mwrap);
  // scheduler
  v.append(el("div",{class:"eyebrow",style:{margin:"22px 0 8px"}},"SCHEDULER"),
    el("div",{id:"schedwrap",style:{color:"var(--mute)",fontSize:"13px"}},"loading…"));
  loadSchedule();

  v.append(el("div",{class:"eyebrow",style:{margin:"22px 0 8px"}},"TOOLS & GATEWAYS"),

  loadToolsGateways();
  // about
  v.append(el("div",{class:"eyebrow",style:{margin:"22px 0 8px"}},"ABOUT"),

}
async function saveBackend(){const b=$("#backendsel").value,m=$("#modelin").value;
  if(!S.server){toast("Static demo — backend switch needs the API server.");return;}
  try{const r=await fetch(API+"/config",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({backend:b,model:m})}).then(r=>r.json());
    S.config=r; toast("Backend → "+r.backend+" ("+(r.model||"")+")"); renderShell(); route();}catch(e){toast("Save failed: "+e.message);}}
async function loadMetrics(wrap){let m={pillars:{},uptime_s:0,runs_total:S.runs.length};
  if(S.server){try{m=await fetch(API+"/metrics.json").then(r=>r.json());}catch(e){}}
  const cells=[["runs",m.runs_total],["uptime",Math.round(m.uptime_s||0)+"s"],
    ["pillars",Object.keys(m.pillars||{}).length],["pages",S.pages.length],["memories",S.memories.length],["graph links",S.graph.links.length]];
  wrap.innerHTML=""; cells.forEach(([k,val])=>wrap.append(el("div",{class:"metric"},el("div",{class:"mv"},String(val)),el("div",{class:"mk"},k))));}
async function loadSchedule(){const w=$("#schedwrap"); if(!w)return;
  if(!S.server){w.textContent="Scheduler available when the API server is running.";return;}
  try{const {jobs}=await fetch(API+"/schedule").then(r=>r.json());
    w.innerHTML=""; if(!jobs.length)w.append(el("div",{style:{color:"var(--mute)",marginBottom:"10px"}},"No scheduled jobs."));
    jobs.forEach(j=>w.append(el("div",{class:"setrow"}, el("div",{}, el("div",{class:"k"},j.task||j.job_id),

      el("button",{class:"btn ghost",onclick:async()=>{await fetch(API+"/schedule/"+j.job_id,{method:"DELETE"});loadSchedule();}},"remove"))));
    const idIn=el("input",{class:"ti",placeholder:"job id",style:{width:"120px"}}),taskIn=el("input",{class:"ti",placeholder:"task",style:{flex:"1"}});
    w.append(el("div",{style:{display:"flex",gap:"8px",marginTop:"10px"}}, idIn,taskIn,
      el("button",{class:"btn",onclick:async()=>{if(!idIn.value||!taskIn.value)return;
        await fetch(API+"/schedule",{method:"POST",headers:{"Content-Type":"application/json"},

  }catch(e){w.textContent="Scheduler unavailable.";}}
async function loadToolsGateways(){const w=$("#toolgate"); if(!w)return;

/* ══════════════ command palette ══════════════ */
function togglePalette(open){const p=$("#palette"); p.classList.toggle("open",open);
  $("#palbtn")?.setAttribute("aria-expanded",open?"true":"false");
  if(open){const i=$("#palInput");i.value="";renderPalette("");i.focus();}}
function renderPalette(q){const list=$("#palList");list.innerHTML="";
  const items=[...NAV.map(([id,l])=>({label:"Go to "+l,act:()=>{togglePalette(false);go(id);},pk:id})),
    {label:"Run a demo deliberation",act:()=>{togglePalette(false);go("studio");setTimeout(()=>startRun("Should we manufacture an analog optical chip or a digital ternary ASIC?"),120);},pk:"run"}];
  const f=q?items.filter(i=>i.label.toLowerCase().includes(q.toLowerCase())):items;
  if(q&&!f.length){list.append(el("div",{class:"opt2",onclick:()=>{togglePalette(false);go("studio");setTimeout(()=>startRun(q),120);}},
    el("span",{html:svg(ICONS.play,"")}),"Run: "+q));return;}
  f.forEach((it,i)=>list.append(el("div",{class:"opt2"+(i===0?" sel":""),onclick:it.act},
    el("span",{style:{color:"var(--signal)",fontFamily:"var(--mono)"}},"▸"),it.label,el("span",{class:"pk"},it.pk||""))));}
$("#palInput")?.addEventListener("input",e=>renderPalette(e.target.value));
document.addEventListener("input",e=>{if(e.target.id==="palInput")renderPalette(e.target.value);});
document.addEventListener("keydown",e=>{if(e.target.id==="palInput"&&e.key==="Enter"){const first=$("#palList .opt2");if(first)first.click();}});

/* ══════════════ starfield ══════════════ */
function buildStars(){const cv=$("#stars"),ctx=cv.getContext("2d");
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  size();addEventListener("resize",size);
  const stars=[...Array(140)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,
    a:Math.random(),s:Math.random()*.02+.004}));
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function tw(){ctx.clearRect(0,0,innerWidth,innerHeight);
    stars.forEach(st=>{if(!reduce)st.a+=st.s;const al=.25+Math.abs(Math.sin(st.a))*.6;
      ctx.fillStyle="rgba(180,210,255,"+al+")";ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fill();});
    if(!reduce)requestAnimationFrame(tw);})();}

boot();
