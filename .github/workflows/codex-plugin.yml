name: Codex plugin checks
on:
  push:
    paths: ['plugins/m1frame/**', '.github/workflows/codex-plugin.yml']
  pull_request:
    paths: ['plugins/m1frame/**', '.github/workflows/codex-plugin.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r plugins/m1frame/requirements.txt
      - run: python plugins/m1frame/scripts/sync_runtime.py --check
      - run: python plugins/m1frame/tests/check_mcp.py
      - run: python plugins/m1frame/tests/check_upgrade.py
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/qa_validate.py
