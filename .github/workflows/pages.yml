name: Deploy Studio to GitHub Pages

# Publishes the m1frame Studio as a public, mobile-responsive demo you can open
# from any phone over the internet (static / key-less DEMO mode — the bundled
# deliberation replays client-side; graph, chat, skills all work).
#
# One-time setup: repo Settings → Pages → Build and deployment → Source = GitHub Actions.
# Then every push to main publishes to https://<owner>.github.io/m1frame/

on:
  push:
    branches: [main]
    paths: ["m1frame-studio.html", "studio/*.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/studio
          cp m1frame-studio.html _site/index.html
          cp studio/demo_run.json studio/wiki_graph.json studio/wiki_pages.json \
             studio/memories.json studio/skills.json _site/studio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
